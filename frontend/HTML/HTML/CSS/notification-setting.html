<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>通知設定</title>
    <link rel="stylesheet" href="notification-setting.css" />
</head>

<body>
    <div class="container">
        <header class="header">
            <button class="nav-icon">☰</button>
            <button class="user-icon"><img class="user-icon-img"
                    src="https://cdn.discordapp.com/attachments/1508778554534395924/1515233618715344948/2026-06-13_14.57.01.png?ex=6a2e42c6&is=6a2cf146&hm=8535b4c7689c43b002b44bf60e2c6c0255cfac5d186345cdd8a076e0cc669dd8&"
                    alt="user"></button>
        </header>

        <main class="page">
            <button class="close-btn">✕</button>

            <h1 class="title">通知設定</h1>

            <div class="setting-item">
                <label for="notification-toggle" class="label">通知を受け取る</label>
                <div class="toggle-wrapper">
                    <input type="checkbox" id="notification-toggle" class="toggle-input" checked />
                    <label for="notification-toggle" class="toggle-label"></label>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
