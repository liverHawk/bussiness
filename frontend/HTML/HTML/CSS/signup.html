<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規会員登録</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <header class="header">
        <h1 class="title">新規会員登録</h1>
        <div class="user-icon">👤</div>
    </header>

    <main class="container">
        <h2 class="section-title">アカウント情報入力</h2>

        <form class="register-form">
            <label for="last-name">姓（必須）</label>
            <input id="last-name" name="last-name" type="text" required>

            <label for="first-name">名（必須）</label>
            <input id="first-name" name="first-name" type="text" required>

            <label for="email">メールアドレス（必須）</label>
            <input id="email" name="email" type="email" required>

            <label for="password">パスワード（必須）</label>
            <input id="password" name="password" type="password" required>
            <p class="note">半角英数字　八文字以上</p>

            <button type="button" class="register-btn">
                この内容で登録にすすむ
            </button>
        </form>
    </main>

    <script>
        (function () {
            const btn = document.querySelector('.register-btn');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const lastName = document.getElementById('last-name');
            const firstName = document.getElementById('first-name');

            function showError(msg) {
                alert(msg);
            }

            async function register() {
                const email = emailInput.value.trim();
                const pwd = passwordInput.value;
                const name = (lastName.value.trim() + ' ' + firstName.value.trim()).trim();

                if (!email) { showError('メールアドレスは必須です'); return; }
                if (!pwd || pwd.length < 8) { showError('パスワードは8文字以上で入力してください'); return; }
                if (!name) { showError('氏名を入力してください'); return; }

                const payload = { email: email, pwd_hash: pwd, name: name };

                try {
                    btn.disabled = true;
                    const res = await fetch('http://localhost:8000/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });

                    if (res.status === 200) {
                        const data = await res.json();
                        localStorage.setItem('accessToken', data.accessToken);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        alert('登録が完了しました');
                        location.href = 'login.html';
                        return;
                    }

                    // エラーハンドリング
                    const err = await res.json().catch(() => null);
                    if (res.status === 400) {
                        const message = err?.error?.message || '入力エラー';
                        const details = err?.error?.details;
                        if (Array.isArray(details) && details.length > 0) {
                            showError(details[0].message);
                        } else {
                            showError(message);
                        }
                    } else if (res.status === 409) {
                        showError(err?.error?.message || 'このメールアドレスは既に登録されています');
                    } else {
                        showError('サーバーエラーが発生しました');
                    }

                } catch (e) {
                    showError('通信エラーが発生しました');
                } finally {
                    btn.disabled = false;
                }
            }

            btn.addEventListener('click', register);
        })();
    </script>

</body>

</html>
