<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニュー</title>
    <style>
        body {
            margin: 0;
            font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
            background: #f3e4d7;
            color: #2b2b2b;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
            background: #f3e4d7;
            color: #2b2b2b;
            display: flex;
            justify-content: flex-start;
        }

        .drawer {
            width: min(50vw, 420px);
            max-width: 100%;
            height: 100vh;
            padding: 20px;
            background: #fff;
            box-shadow: 5px 0 30px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .close-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #f0f0f0;
            color: #444;
            font-size: 22px;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .menu-list {
            list-style: none;
            padding: 0;
            margin: 16px 0 0;
            display: grid;
            gap: 20px;
            flex: 1;
            grid-template-rows: repeat(6, minmax(0, 1fr));
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            height: 100%;
            border-radius: 16px;
            text-decoration: none;
            color: #2b2b2b;
            font-size: 16px;
            background: #f7f3f0;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .menu-item:hover,
        .menu-item:focus-visible {
            background: #fff2dd;
            transform: translateX(2px);
        }

        .menu-item-icon {
            width: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .separator {
            height: 1px;
            background: #e2d8d0;
            margin: 18px 0;
            border: none;
        }

        .overlay {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="drawer">
        <button class="close-btn" onclick="window.history.back()" aria-label="閉じる">✕</button>
        <nav>
            <ul class="menu-list">
                <li><a class="menu-item" href="HTML/CSS/login.html"><span class="menu-item-icon">🏠</span>ホーム</a></li>
                <li><a class="menu-item" href="#"><span class="menu-item-icon">🔖</span>セーブ</a></li>
                <li><a class="menu-item" href="#"><span class="menu-item-icon">🪙</span>〇〇コイン</a></li>
                <li><a class="menu-item" href="#"><span class="menu-item-icon">💬</span>レビュー・フォト</a></li>
                <li><a class="menu-item" href="HTML/CSS/setting.html"><span class="menu-item-icon">⚙️</span>設定</a></li>
                <li><a class="menu-item" href="HTML/CSS/auth.html"><span class="menu-item-icon">↩️</span>ログアウト</a></li>
            </ul>
        </nav>
    </div>
    <div class="overlay" onclick="window.history.back()"></div>
</body>

</html>
