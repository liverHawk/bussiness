<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニュー</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
            background: #f3e4d7;
            color: #2b2b2b;
        }

        body {
            position: relative;
        }

        /* Full-screen preview (background) */
        .preview {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f3e4d7;
            overflow: hidden;
            z-index: 0;
        }

        .preview::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            pointer-events: none;
            z-index: 1;
        }

        /* Drawer menu (overlay) */
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: min(60vw, 380px);
            height: 100vh;
            padding: 20px;
            background: #fff;
            box-shadow: 5px 0 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            overflow: hidden;
            /* ← 全体はスクロールしない */
        }

        .drawer nav {
            flex: 1;
            min-height: 0;
            /* ← スクロール跳ね返り防止 */
            overflow: hidden;
        }

        .menu-list {
            list-style: none;
            padding: 0;
            margin: 16px 0 0;
            display: grid;
            gap: 16px;
            flex: 1;
            min-height: 0;
            /* ← これがないとログアウトが見切れる */
            overflow-y: auto;
            /* ← メニューだけスクロール */
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .close-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #f0f0f0;
            color: #444;
            font-size: 22px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 16px;
            text-decoration: none;
            color: #2b2b2b;
            font-size: 16px;
            background: #f7f3f0;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .menu-item:hover,
        .menu-item:focus-visible {
            background: #fff2dd;
            transform: translateX(2px);
        }

        .menu-item-icon {
            width: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Toggle button for submenu */
        .menu-item-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 14px;
            border-radius: 16px;
            border: none;
            background: #f7f3f0;
            color: #2b2b2b;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .menu-item-toggle:hover,
        .menu-item-toggle:focus-visible {
            background: #fff2dd;
            transform: translateX(2px);
        }

        .submenu-list {
            list-style: none;
            padding: 0;
            margin: 8px 0 0 40px;
            display: none;
            gap: 10px;
        }

        .submenu-list.show {
            display: grid;
        }

        .submenu-item {
            display: block;
            width: 100%;
            padding: 10px 12px;
            border-radius: 14px;
            border: none;
            background: #faf6f2;
            color: #2b2b2b;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .submenu-item:hover,
        .submenu-item:focus-visible {
            background: #fff2dd;
            transform: translateX(1px);
        }

        .fallback-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 18px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="preview">
        <iframe id="previewFrame" class="preview-frame" src="" title="元の画面"></iframe>
        <div class="fallback-text" id="fallbackText">元の画面を読み込み中です...</div>
    </div>

    <div class="drawer">
        <button class="close-btn" type="button" aria-label="閉じる">✕</button>

        <nav>
            <ul class="menu-list">
                <li><a class="menu-item" href="#"><span class="menu-item-icon">🏠</span>ホーム</a></li>
                <li><a class="menu-item" href="#"><span class="menu-item-icon">🔖</span>セーブ</a></li>

                <li>
                    <button class="menu-item-toggle" type="button" id="coinToggle" aria-expanded="false"
                        aria-controls="coinSubmenu">
                        <span class="menu-item-icon">🪙</span>めぐコイン
                    </button>
                    <ul class="submenu-list" id="coinSubmenu" role="menu">
                        <li><button class="submenu-item" type="button">決済</button></li>
                        <li><button class="submenu-item" type="button">チャージ</button></li>
                        <li><button class="submenu-item" type="button">マイクーポン</button></li>
                    </ul>
                </li>

                <li><a class="menu-item" href="#"><span class="menu-item-icon">💬</span>レビュー・フォト</a></li>
                <li><a class="menu-item" href="HTML/CSS/setting.html"><span class="menu-item-icon">⚙️</span>設定</a></li>
                <li><a class="menu-item" href="#"><span class="menu-item-icon">↩️</span>ログアウト</a></li>
            </ul>
        </nav>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const src = params.get('src');
        const frame = document.getElementById('previewFrame');
        const fallback = document.getElementById('fallbackText');

        if (src) {
            frame.src = src;
            frame.onload = () => fallback.style.display = 'none';
        } else {
            fallback.textContent = '元の画面情報がありません。メニューアイコンから開いてください。';
        }

        /* ×ボタンでメニューを閉じる */
        const closeButton = document.querySelector('.close-btn');
        const drawer = document.querySelector('.drawer');

        if (closeButton && drawer) {
            closeButton.addEventListener('click', () => {
                drawer.style.display = 'none';
            });
        }

        /* めぐコインのサブメニュー */
        const toggleButton = document.getElementById('coinToggle');
        const submenu = document.getElementById('coinSubmenu');

        if (toggleButton && submenu) {
            toggleButton.addEventListener('click', () => {
                const expanded = toggleButton.getAttribute('aria-expanded') === 'true';
                toggleButton.setAttribute('aria-expanded', String(!expanded));
                submenu.classList.toggle('show');
            });
        }
    </script>
</body>

</html>
