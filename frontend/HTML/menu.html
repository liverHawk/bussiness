<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニュー</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
            background: #f3e4d7;
            color: #2b2b2b;
        }

        body {
            display: flex;
        }

        .drawer {
            width: min(50vw, 420px);
            max-width: 100%;
            height: 100vh;
            padding: 20px;
            background: #fff;
            box-shadow: 5px 0 30px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
        }

        .preview {
            flex: 1;
            background: #f3e4d7;
            position: relative;
            overflow: hidden;
        }

        .preview::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.75);
            pointer-events: none;
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .close-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #f0f0f0;
            color: #444;
            font-size: 22px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .menu-list {
            list-style: none;
            padding: 0;
            margin: 16px 0 0;
            display: grid;
            gap: 16px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 16px;
            text-decoration: none;
            color: #2b2b2b;
            font-size: 16px;
            background: #f7f3f0;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .menu-item:hover,
        .menu-item:focus-visible {
            background: #fff2dd;
            transform: translateX(2px);
        }

        .menu-item-icon {
            width: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .separator {
            height: 1px;
            background: #e2d8d0;
            margin: 18px 0;
            border: none;
        }

        .fallback-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 18px;
            padding: 20px;
            text-align: center;
        }

        .preview {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <div class="drawer">
        <button class="close-btn" onclick="window.history.back()" aria-label="閉じる">✕</button>
        <nav>
            <ul class="menu-list">
                <li><a class="menu-item" href="HTML/CSS/login.html"><span class="menu-item-icon">🏠</span>ホーム</a></li>
                <li><a class="menu-item" href="#"><span class="menu-item-icon">🔖</span>セーブ</a></li>
                <li><a class="menu-item" href="#"><span class="menu-item-icon">🪙</span>〇〇コイン</a></li>
                <li><a class="menu-item" href="#"><span class="menu-item-icon">💬</span>レビュー・フォト</a></li>
                <li><a class="menu-item" href="HTML/CSS/setting.html"><span class="menu-item-icon">⚙️</span>設定</a></li>
                <li><a class="menu-item" href="HTML/CSS/auth.html"><span class="menu-item-icon">↩️</span>ログアウト</a></li>
            </ul>
        </nav>
    </div>
    <div class="preview">
        <iframe id="previewFrame" class="preview-frame" src="" title="元の画面"></iframe>
        <div class="fallback-text" id="fallbackText">元の画面を読み込み中です...</div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const src = params.get('src');
        const frame = document.getElementById('previewFrame');
        const fallback = document.getElementById('fallbackText');

        if (src) {
            frame.src = src;
            frame.onload = () => {
                fallback.style.display = 'none';
            };
        } else {
            fallback.textContent = '元の画面情報がありません。メニューアイコンから開いてください。';
        }
    </script>
</body>

</html>
